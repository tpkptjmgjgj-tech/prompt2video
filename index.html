<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>US Creator AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #111;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 25px 18px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      resize: vertical;
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .option {
      border: 1px solid #ccc;
      background: white;
      padding: 10px 14px;
      border-radius: 20px;
      cursor: pointer;
    }

    .option.active {
      background: #111;
      color: white;
    }

    button {
      width: 100%;
      border: none;
      padding: 15px;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    #result {
      display: none;
    }

    .resultBox {
      background: #f7f7f7;
      padding: 15px;
      border-radius: 10px;
      margin-top: 10px;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .copyBtn {
      margin-top: 10px;
      background: #333;
      font-size: 14px;
      padding: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🇺🇸 US Creator AI</h1>
  <p class="subtitle">Nepali Idea → US Content</p>

  <div class="card">

    <label>🇳🇵 Your Idea</label>

    <textarea id="idea"
      placeholder="Example: एउटा नेपाली गाउँमा अनौठो घटना भयो..."></textarea>

    <br><br>

    <label>Content Type</label>

    <div class="options">
      <div class="option active" onclick="selectType(this,'Facts')">
        🇺🇸 Facts
      </div>

      <div class="option" onclick="selectType(this,'Crime')">
        🔎 Crime
      </div>

      <div class="option" onclick="selectType(this,'Entertainment')">
        🎬 Entertainment
      </div>
    </div>

    <label>Duration</label>

    <div class="options">
      <div class="option active" onclick="selectDuration(this,30)">
        30 Seconds
      </div>

      <div class="option" onclick="selectDuration(this,60)">
        60 Seconds
      </div>

      <div class="option" onclick="selectDuration(this,90)">
        90 Seconds
      </div>
    </div>

    <button onclick="generateContent()">
      ⚡ Generate US Content
    </button>

  </div>


  <div class="card" id="result">

    <h2>🇺🇸 Generated Content</h2>

    <label>🔥 Hook</label>
    <div class="resultBox" id="hook"></div>

    <label>🎬 US-Style Script</label>
    <div class="resultBox" id="script"></div>

    <label>📌 YouTube Title</label>
    <div class="resultBox" id="title"></div>

    <label>📝 Description</label>
    <div class="resultBox" id="description"></div>

    <label>#️⃣ Tags</label>
    <div class="resultBox" id="tags"></div>

    <button class="copyBtn" onclick="copyAll()">
      📋 Copy Everything
    </button>

  </div>

</div>


<script>

let selectedType = "Facts";
let selectedDuration = 30;


function selectType(element, type) {

  document.querySelectorAll(".options .option")
    .forEach(el => {

      if (
        el.innerText.includes("Facts") ||
        el.innerText.includes("Crime") ||
        el.innerText.includes("Entertainment")
      ) {
        el.classList.remove("active");
      }

    });

  element.classList.add("active");

  selectedType = type;
}


function selectDuration(element, duration) {

  const options = element.parentElement.children;

  for (let option of options) {
    option.classList.remove("active");
  }

  element.classList.add("active");

  selectedDuration = duration;
}


function generateContent() {

  const idea = document.getElementById("idea").value.trim();

  if (!idea) {
    alert("Please enter your Nepali idea first.");
    return;
  }


  let hook = "";
  let script = "";


  if (selectedType === "Facts") {

    hook =
      "You won't believe this incredible fact about America!";

    script =
      "Did you know this fascinating fact? " +
      idea +
      " Here's what makes it so interesting. " +
      "Millions of people may not know about this surprising detail. " +
      "And the most interesting part is that there is even more to discover. " +
      "Follow for more amazing facts!";

  }


  else if (selectedType === "Crime") {

    hook =
      "This mysterious case shocked people across America...";

    script =
      "This is one of those cases that is hard to forget. " +
      idea +
      " The investigation raised serious questions, " +
      "and people were left wondering what really happened. " +
      "Even today, the story continues to attract attention. " +
      "Follow for more true crime stories.";

  }


  else {

    hook =
      "This might be one of the most unbelievable stories you'll hear today!";

    script =
      "Imagine seeing this happen in real life. " +
      idea +
      " The story quickly became interesting because of what happened next. " +
      "People couldn't stop talking about it. " +
      "Would you believe this if you saw it yourself? " +
      "Follow for more amazing stories!";

  }


  const title =
    "You Won't Believe This 😱 | US " +
    selectedType +
    " #Shorts";


  const description =
    "Discover this amazing US-style " +
    selectedType.toLowerCase() +
    " story. " +
    "Watch until the end and follow for more short-form content.";


  const tags =
    "#USA #USFacts #Shorts #Viral #Trending #" +
    selectedType +
    " #YouTubeShorts";


  document.getElementById("hook").innerText = hook;

  document.getElementById("script").innerText =
    script + "\n\nDuration: " +
    selectedDuration +
    " seconds";

  document.getElementById("title").innerText = title;

  document.getElementById("description").innerText =
    description;

  document.getElementById("tags").innerText =
    tags;


  document.getElementById("result").style.display = "block";

  window.scrollTo({
    top: document.getElementById("result").offsetTop,
    behavior: "smooth"
  });

}


function copyAll() {

  const text =
    "HOOK:\n" +
    document.getElementById("hook").innerText +

    "\n\nSCRIPT:\n" +
    document.getElementById("script").innerText +

    "\n\nTITLE:\n" +
    document.getElementById("title").innerText +

    "\n\nDESCRIPTION:\n" +
    document.getElementById("description").innerText +

    "\n\nTAGS:\n" +
    document.getElementById("tags").innerText;


  navigator.clipboard.writeText(text)
    .then(() => {
      alert("Copied successfully!");
    })
    .catch(() => {
      alert("Copy failed. Please copy manually.");
    });

}

</script>

</body>
</html>
