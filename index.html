<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>US Creator AI</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #111;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 25px 18px;
    }

    h1 { text-align: center; margin-bottom: 8px; }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      resize: vertical;
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .option {
      border: 1px solid #ccc;
      background: white;
      padding: 10px 14px;
      border-radius: 20px;
      cursor: pointer;
    }

    .option.active {
      background: #111;
      color: white;
    }

    button {
      width: 100%;
      border: none;
      padding: 15px;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    .resultBox {
      background: #f7f7f7;
      padding: 15px;
      border-radius: 10px;
      margin-top: 10px;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .copyBtn {
      margin-top: 10px;
      background: #333;
      font-size: 14px;
      padding: 10px;
    }

    #result {
      display: none;
    }

    #status {
      text-align: center;
      margin-top: 12px;
      color: #666;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🇺🇸 US Creator AI</h1>
  <p class="subtitle">Nepali Idea → US Content</p>

  <div class="card">

    <label>🇳🇵 Your Idea</label>

    <textarea id="idea"
      placeholder="Example: एउटा नेपाली गाउँमा अनौठो घटना भयो..."></textarea>

    <br><br>

    <label>Content Type</label>

    <div class="options" id="typeOptions">
      <div class="option active" onclick="selectType(this,'Facts')">
        🇺🇸 Facts
      </div>

      <div class="option" onclick="selectType(this,'Crime')">
        🔎 Crime
      </div>

      <div class="option" onclick="selectType(this,'Entertainment')">
        🎬 Entertainment
      </div>
    </div>

    <label>Duration</label>

    <div class="options" id="durationOptions">
      <div class="option active" onclick="selectDuration(this,30)">
        30 Seconds
      </div>

      <div class="option" onclick="selectDuration(this,60)">
        60 Seconds
      </div>

      <div class="option" onclick="selectDuration(this,90)">
        90 Seconds
      </div>
    </div>

    <button id="generateBtn" onclick="generateContent()">
      ⚡ Generate US Content
    </button>

    <div id="status"></div>

  </div>

  <div class="card" id="result">

    <h2>🇺🇸 Generated Content</h2>

    <label>🔥 Hook</label>
    <div class="resultBox" id="hook"></div>

    <label>🎬 US-Style Script</label>
    <div class="resultBox" id="script"></div>

    <label>📌 YouTube Title</label>
    <div class="resultBox" id="title"></div>

    <label>📝 Description</label>
    <div class="resultBox" id="description"></div>

    <label>#️⃣ Tags</label>
    <div class="resultBox" id="tags"></div>

    <button class="copyBtn" onclick="copyAll()">
      📋 Copy Everything
    </button>

  </div>

</div>

<script>

let selectedType = "Facts";
let selectedDuration = 30;

function selectType(element, type) {
  document.querySelectorAll("#typeOptions .option")
    .forEach(el => el.classList.remove("active"));

  element.classList.add("active");
  selectedType = type;
}

function selectDuration(element, duration) {
  document.querySelectorAll("#durationOptions .option")
    .forEach(el => el.classList.remove("active"));

  element.classList.add("active");
  selectedDuration = duration;
}

async function generateContent() {

  const idea = document.getElementById("idea").value.trim();
  const button = document.getElementById("generateBtn");
  const status = document.getElementById("status");

  if (!idea) {
    alert("Please enter your Nepali idea first.");
    return;
  }

  button.disabled = true;
  button.innerText = "⏳ AI is generating...";
  status.innerText = "Please wait...";

  try {

    const response = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        idea: idea,
        type: selectedType,
        duration: selectedDuration
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "AI generation failed");
    }

    document.getElementById("hook").innerText =
      data.hook || "";

    document.getElementById("script").innerText =
      data.script || "";

    document.getElementById("title").innerText =
      data.title || "";

    document.getElementById("description").innerText =
      data.description || "";

    document.getElementById("tags").innerText =
      data.tags || "";

    document.getElementById("result").style.display = "block";

    status.innerText = "✅ Generated successfully!";

    window.scrollTo({
      top: document.getElementById("result").offsetTop,
      behavior: "smooth"
    });

  } catch (error) {

    console.error(error);

    status.innerText = "❌ " + error.message;

    alert(
      "AI connection is not ready yet. Backend setup is required."
    );

  } finally {

    button.disabled = false;
    button.innerText = "⚡ Generate US Content";

  }
}

function copyAll() {

  const text =
    "HOOK:\n" +
    document.getElementById("hook").innerText +

    "\n\nSCRIPT:\n" +
    document.getElementById("script").innerText +

    "\n\nTITLE:\n" +
    document.getElementById("title").innerText +

    "\n\nDESCRIPTION:\n" +
    document.getElementById("description").innerText +

    "\n\nTAGS:\n" +
    document.getElementById("tags").innerText;

  navigator.clipboard.writeText(text)
    .then(() => alert("Copied successfully!"))
    .catch(() => alert("Copy failed."));

}

</script>

</body>
</html>
